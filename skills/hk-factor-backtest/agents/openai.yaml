interface:
  display_name: "港股标准化单因子与组合回测"
  short_description: "单因子与训练限2010–2022，20日滚动及用户指定报告模板"
  default_prompt: "使用 $hk-factor-backtest，仅以2010-01-01至2022-12-31数据完成新单因子回测、筛选与Ridge/LightGBM训练；2023–2025只作冻结组合测试。默认20日每日滚动。单因子按LLM基本面页面提取的通用视觉模板，采用总览／单因子／全部因子，仅展示、不分好坏；模板不含历史实验数据，多因子按TA-Lib双库模板输出报告与检验回执。历史报告重建保留原口径。"
