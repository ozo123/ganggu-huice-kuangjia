<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单因子回测报告</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/report.css"></head>
<body><main>
<header><div class="eyebrow" id="source">单因子研究</div><h1 id="title">单因子回测报告</h1><p id="description"></p><div class="numbers" id="numbers"></div></header>
<nav><a href="#results">收益对比</a><a href="#selected">入选因子</a><a href="#all">全部单因子</a><a href="#similarity">相似度矩阵</a><a href="#experiments">实验档案</a><a href="#method">方法与检验</a></nav>
<section class="page" id="results"><h2>单因子 · 收益曲线总览</h2><div class="controls"><label>评估设置<select id="context"></select></label><label>纵轴<select id="scale"><option value="linear">线性净值</option><option value="log">对数净值</option></select></label><label>持仓<select id="portfolio"><option value="LS">多空</option><option value="long">最高组只做多</option><option value="both">同时显示</option></select></label></div><div class="filters" id="filters"></div><p class="note" id="context-note"></p><div class="chart large" id="compare"></div><div class="downloads" id="downloads"></div><div class="scroll" id="metrics"></div><h3>逐年收益</h3><div class="scroll" id="annual"></div><h3>Rank IC 与收益</h3><div class="chart" id="scatter"></div></section>
<section class="page" id="selected"><h2>入选因子</h2><p class="muted">使用收益对比中的当前评估设置。</p><div class="scroll" id="selected-table"></div></section>
<section class="page" id="all"><h2>公式、参数与机制假设</h2><div class="controls"><label>搜索<input id="search" type="search" placeholder="名称、公式、经济含义"></label><label>状态<select id="status"><option value="">全部状态</option></select></label></div><p id="count"></p><div class="scroll" id="catalog"></div></section>
<section class="page" id="similarity"><h2>因子相似度矩阵</h2><p id="correlation-note" class="note"></p><div class="chart large" id="matrix"></div></section>
<section class="page" id="experiments"><h2>实验档案</h2><div id="experiment-list"></div></section>
<section class="page method" id="method"><h2>方法与检验</h2><div id="method-content"></div></section>
<section class="page" id="detail"><a href="#all">← 全部因子</a><header><h1 id="factor-title"></h1><p id="factor-status"></p></header><div class="formula mathbox" id="formula"></div><h2>参数与计算口径</h2><p id="parameters"></p><p id="calculation"></p><h2>隐含经济含义 · 假设</h2><p id="economics"></p><div class="controls"><label>评估设置<select id="factor-context"></select></label></div><p class="note" id="factor-note"></p><div class="chart" id="factor-nav"></div><div class="chart" id="factor-ic"></div><h2>分组表现与年度收益</h2><div class="chart" id="groups"></div><div class="scroll" id="factor-annual"></div><div class="scroll" id="factor-metrics"></div></section>
<footer id="footer">单因子研究报告 · 经济机制解释为假设</footer></main><script src="report-data.js"></script><script src="assets/plotly.min.js"></script><script src="assets/report.js"></script></body></html>
